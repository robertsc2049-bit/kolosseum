<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 24px auto;
      max-width: 1080px;
      padding: 0 16px 48px;
    }

    body[data-copy-ready="false"] {
      visibility: hidden;
    }

    h1,
    h2,
    h3 {
      margin: 0 0 10px;
    }

    .card {
      border: 1px solid currentColor;
      border-radius: 10px;
      margin-bottom: 16px;
      padding: 16px;
    }

    .row {
      align-items: end;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .field {
      display: grid;
      flex: 1 1 220px;
      gap: 6px;
    }

    input,
    select,
    button,
    textarea {
      box-sizing: border-box;
      font: inherit;
      padding: 10px;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    textarea,
    pre {
      max-width: 100%;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    textarea {
      min-height: 150px;
      width: 100%;
    }

    pre {
      border: 1px solid currentColor;
      border-radius: 8px;
      padding: 12px;
    }

    .summary-grid,
    .history-grid,
    .queue-grid {
      display: grid;
      gap: 12px;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(190px, 1fr)
        );
    }

    .summary-item,
    .queue-item {
      border: 1px solid currentColor;
      border-radius: 8px;
      padding: 12px;
    }

    .summary-value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .muted {
      opacity: 0.72;
    }

    .mono {
      font-family:
        Consolas,
        Menlo,
        Monaco,
        monospace;
    }

    .status {
      border: 1px solid currentColor;
      border-radius: 8px;
      margin-top: 12px;
      padding: 10px;
    }

    .step-actions {
      margin-top: 14px;
    }

    .queue-list {
      display: grid;
      gap: 10px;
    }

    .check-field {
      align-items: start;
      display: grid;
      gap: 10px;
      grid-template-columns: auto 1fr;
      margin-bottom: 10px;
    }
  </style>
</head>

<body data-copy-ready="false">
  <header class="card">
    <h1 data-copy-id="BETA16_COPY_PAGE_TITLE"></h1>
    <p
      class="muted"
      data-copy-id="BETA16_COPY_PAGE_INTRO"
    ></p>
    <div
      id="appStatus"
      class="status"
      aria-live="polite"
    ></div>
  </header>

  <section class="card">
    <h2 data-copy-id="BETA16_COPY_AUTH_HEADING"></h2>

    <div class="row">
      <label class="field">
        <span data-copy-id="BETA16_COPY_USER_ID_LABEL"></span>
        <input
          id="authUserId"
          autocomplete="username"
          data-copy-placeholder-id="BETA16_COPY_USER_ID_PLACEHOLDER"
        />
      </label>

      <label class="field">
        <span data-copy-id="BETA16_COPY_EMAIL_LABEL"></span>
        <input
          id="authEmail"
          type="email"
          autocomplete="email"
          data-copy-placeholder-id="BETA16_COPY_EMAIL_PLACEHOLDER"
        />
      </label>

      <label class="field">
        <span data-copy-id="BETA16_COPY_DISPLAY_NAME_LABEL"></span>
        <input
          id="authDisplayName"
          autocomplete="name"
          data-copy-placeholder-id="BETA16_COPY_DISPLAY_NAME_PLACEHOLDER"
        />
      </label>

      <button
        id="btnAuth"
        data-copy-id="BETA16_COPY_AUTH_ACTION"
      ></button>
    </div>
  </section>

  <section class="card">
    <h2
      data-copy-id="BETA16_COPY_ACKNOWLEDGEMENT_HEADING"
    ></h2>

    <label class="check-field">
      <input
        id="betaAcknowledged"
        type="checkbox"
      />
      <span
        data-copy-id="BETA16_COPY_ACKNOWLEDGEMENT_LABEL"
      ></span>
    </label>

    <label class="check-field">
      <input
        id="jurisdictionAcknowledged"
        type="checkbox"
      />
      <span
        data-copy-id="BETA16_COPY_JURISDICTION_LABEL"
      ></span>
    </label>

    <button
      id="btnAcknowledge"
      data-copy-id="BETA16_COPY_ACKNOWLEDGEMENT_ACTION"
      disabled
    ></button>
  </section>

  <section class="card">
    <h2
      data-copy-id="BETA16_COPY_DECLARATION_HEADING"
    ></h2>

    <div class="row">
      <label class="field">
        <span data-copy-id="BETA16_COPY_ACTIVITY_LABEL"></span>
        <select id="activityId">
          <option
            value="powerlifting"
            data-copy-id="BETA16_COPY_ACTIVITY_POWERLIFTING"
          ></option>
          <option
            value="general_strength"
            data-copy-id="BETA16_COPY_ACTIVITY_GENERAL_STRENGTH"
          ></option>
          <option
            value="rugby_union"
            data-copy-id="BETA16_COPY_ACTIVITY_RUGBY_UNION"
          ></option>
        </select>
      </label>

      <button
        id="btnDeclare"
        data-copy-id="BETA16_COPY_DECLARATION_ACTION"
        disabled
      ></button>
    </div>

    <p
      class="muted"
      data-copy-id="BETA16_COPY_DECLARATION_ACKNOWLEDGEMENT"
    ></p>
  </section>

  <section class="card">
    <h2 data-copy-id="BETA16_COPY_COMPILE_HEADING"></h2>

    <button
      id="btnCompile"
      data-copy-id="BETA16_COPY_COMPILE_ACTION"
      disabled
    ></button>
  </section>

  <section class="card">
    <h2
      data-copy-id="BETA16_COPY_SESSION_CONTROLS_HEADING"
    ></h2>

    <div class="row">
      <label class="field">
        <span data-copy-id="BETA16_COPY_SESSION_ID_LABEL"></span>
        <input
          id="sessionId"
          class="mono"
          readonly
          data-copy-placeholder-id="BETA16_COPY_SESSION_ID_PLACEHOLDER"
        />
      </label>

      <button
        id="btnStart"
        data-copy-id="BETA16_COPY_START_ACTION"
        disabled
      ></button>

      <button
        id="btnRefresh"
        data-copy-id="BETA16_COPY_REFRESH_ACTION"
        disabled
      ></button>

      <button
        id="btnSplitSession"
        data-copy-id="BETA16_COPY_SPLIT_ACTION"
        disabled
      ></button>
    </div>
  </section>

  <section class="card">
    <h2 data-copy-id="BETA16_COPY_SUMMARY_HEADING"></h2>

    <div class="summary-grid">
      <div class="summary-item">
        <div data-copy-id="BETA16_COPY_LIFECYCLE_LABEL"></div>
        <div id="statLifecycle" class="summary-value"></div>
      </div>

      <div class="summary-item">
        <div data-copy-id="BETA16_COPY_COMPLETED_LABEL"></div>
        <div id="statCompleted" class="summary-value">0</div>
      </div>

      <div class="summary-item">
        <div data-copy-id="BETA16_COPY_REMAINING_LABEL"></div>
        <div id="statRemaining" class="summary-value">0</div>
      </div>

      <div class="summary-item">
        <div data-copy-id="BETA16_COPY_DROPPED_LABEL"></div>
        <div id="statDropped" class="summary-value">0</div>
      </div>

      <div class="summary-item">
        <div data-copy-id="BETA16_COPY_CLASSIFICATION_LABEL"></div>
        <div id="statClassification" class="summary-value"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2
      data-copy-id="BETA16_COPY_CURRENT_ITEM_HEADING"
    ></h2>

    <div id="currentItem"></div>

    <div class="row step-actions">
      <button
        id="btnCompleteStep"
        data-copy-id="BETA16_COPY_COMPLETE_ACTION"
        disabled
      ></button>

      <button
        id="btnContinue"
        data-copy-id="BETA16_COPY_RETURN_CONTINUE_ACTION"
        disabled
      ></button>

      <button
        id="btnSkip"
        data-copy-id="BETA16_COPY_RETURN_SKIP_ACTION"
        disabled
      ></button>
    </div>
  </section>

  <section class="card">
    <h2 data-copy-id="BETA16_COPY_QUEUE_HEADING"></h2>

    <div class="queue-grid">
      <div>
        <h3 data-copy-id="BETA16_COPY_CURRENT_LABEL"></h3>
        <div id="queueCurrent" class="queue-list"></div>
      </div>

      <div>
        <h3 data-copy-id="BETA16_COPY_UP_NEXT_LABEL"></h3>
        <div id="queueUpcoming" class="queue-list"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 data-copy-id="BETA16_COPY_HISTORY_HEADING"></h2>

    <div class="history-grid">
      <div>
        <h3
          data-copy-id="BETA16_COPY_HISTORY_COMPLETED"
        ></h3>
        <div id="historyCompleted" class="queue-list"></div>
      </div>

      <div>
        <h3
          data-copy-id="BETA16_COPY_HISTORY_DROPPED"
        ></h3>
        <div id="historyDropped" class="queue-list"></div>
      </div>
    </div>
  </section>

  <section
    id="beta17CoachManagedPath"
    class="card"
  >
    <h2 data-copy-id="BETA17_COPY_TITLE"></h2>
    <p
      class="muted"
      data-copy-id="BETA17_COPY_INTRO"
    ></p>

    <div class="row">
      <label class="field">
        <span data-copy-id="BETA17_COPY_COACH_ID_LABEL"></span>
        <input id="beta17CoachId" />
      </label>

      <label class="field">
        <span data-copy-id="BETA17_COPY_COACH_EMAIL_LABEL"></span>
        <input
          id="beta17CoachEmail"
          type="email"
        />
      </label>

      <label class="field">
        <span data-copy-id="BETA17_COPY_COACH_NAME_LABEL"></span>
        <input id="beta17CoachName" />
      </label>

      <button
        id="beta17ProfileAction"
        data-copy-id="BETA17_COPY_PROFILE_ACTION"
      ></button>
    </div>

    <div class="row step-actions">
      <button
        id="beta17InviteAction"
        data-copy-id="BETA17_COPY_INVITE_ACTION"
        disabled
      ></button>

      <button
        id="beta17AcceptAction"
        data-copy-id="BETA17_COPY_ACCEPT_ACTION"
        disabled
      ></button>

      <button
        id="beta17RevokeAction"
        data-copy-id="BETA17_COPY_REVOKE_ACTION"
        disabled
      ></button>
    </div>

    <div class="row step-actions">
      <label class="field">
        <span data-copy-id="BETA17_COPY_TEMPLATE_ID_LABEL"></span>
        <input
          id="beta17TemplateId"
          value="beta_template_powerlifting_001"
        />
      </label>

      <button
        id="beta17AssignmentAction"
        data-copy-id="BETA17_COPY_ASSIGNMENT_ACTION"
        disabled
      ></button>

      <button
        id="beta17ArtefactAction"
        data-copy-id="BETA17_COPY_ARTEFACT_ACTION"
        disabled
      ></button>
    </div>

    <label class="field step-actions">
      <span data-copy-id="BETA17_COPY_NOTE_LABEL"></span>
      <textarea id="beta17NoteText"></textarea>
    </label>

    <div class="row step-actions">
      <label class="field">
        <span data-copy-id="BETA17_COPY_NOTE_VISIBILITY_LABEL"></span>
        <select id="beta17NoteVisibility">
          <option
            value="coach_private"
            data-copy-id="BETA17_COPY_NOTE_PRIVATE"
          ></option>
          <option
            value="athlete_visible"
            data-copy-id="BETA17_COPY_NOTE_ATHLETE_VISIBLE"
          ></option>
        </select>
      </label>

      <button
        id="beta17NoteAction"
        data-copy-id="BETA17_COPY_NOTE_ACTION"
        disabled
      ></button>
    </div>

    <p
      class="muted"
      data-copy-id="BETA17_COPY_NON_BINDING_NOTICE"
    ></p>

    <h3 data-copy-id="BETA17_COPY_OUTPUT_LABEL"></h3>
    <pre id="beta17Output">-</pre>
  </section>

  <details class="card">
    <summary data-copy-id="BETA16_COPY_RAW_INPUT_HEADING"></summary>
    <textarea id="phase1Input" readonly></textarea>
  </details>

  <details class="card">
    <summary data-copy-id="BETA16_COPY_RAW_STATE_HEADING"></summary>
    <pre id="stateOut">-</pre>
  </details>

  <details class="card">
    <summary data-copy-id="BETA16_COPY_LOG_HEADING"></summary>
    <pre id="logOut">-</pre>
  </details>

  <script
    type="module"
    src="/ui/v0-session-runner.js"
  ></script>
  <script
    type="module"
    src="/ui/beta17-coach-managed.js"
  ></script>
</body>
</html>
