# ==========================================================
# KOLOSSEUM WORKFLOW POLICY
# ----------------------------------------------------------
# Temporary LAUNCH-04 deterministic generated-artefact writer.
# Runs only on the LAUNCH-04 branch and is deleted before final acceptance.
# It may update generated indexes only; it does not alter product semantics.
# ==========================================================
name: launch04-generate-final

on:
  push:
    branches:
      - automation/launch-04-production-billing-lifecycle

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: automation/launch-04-production-billing-lifecycle
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "25.9.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate repository-authoritative indexes
        run: |
          node ci/scripts/run_failure_token_index_guard.mjs --write
          node ci/scripts/write_checksums.mjs --write

      - name: Commit generated artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dev/FAILURE_TOKEN_INDEX.md docs/checksums.sha256 spine/BETA_ARTEFACT_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Generated artefacts already current."
          else
            git commit -m "chore(ci): refresh launch 04 generated authority"
            git push origin HEAD:automation/launch-04-production-billing-lifecycle
          fi
