name: launch04-generate-failure-index

on:
  push:
    branches:
      - automation/launch-04-production-billing-lifecycle

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/launch-04-production-billing-lifecycle
      - uses: actions/setup-node@v5
        with:
          node-version: 25.9.0
      - name: Generate failure token index
        run: node ci/scripts/run_failure_token_index_guard.mjs --write
      - name: Commit generated index
        run: |
          if git diff --quiet -- docs/dev/FAILURE_TOKEN_INDEX.md; then
            echo "Index already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dev/FAILURE_TOKEN_INDEX.md
          git commit -m "chore(ci): regenerate failure token index"
          git push origin HEAD:automation/launch-04-production-billing-lifecycle
