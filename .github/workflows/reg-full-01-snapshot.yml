name: reg-full-01-snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Archive repository
        run: |
          tar --exclude=.git -czf /tmp/kolosseum-reg-full-01-source.tgz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: kolosseum-reg-full-01-source
          path: /tmp/kolosseum-reg-full-01-source.tgz
          if-no-files-found: error
          retention-days: 1
