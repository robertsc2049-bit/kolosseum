# ==========================================================
# KOLOSSEUM WORKFLOW POLICY
# ----------------------------------------------------------
# protect-main-auto-revert.yml
# - Main protection workflow; preserves protected PR revert behaviour.
# - GitHub Actions owns orchestration only.
# - npm scripts and repository guards own proof meaning.
# - A failed command must fail the job.
# ==========================================================
# DEV NOTE: Main-branch protection workflow boundary.
#
# This workflow reacts after a push lands on main. It does not replace normal
# PR checks, branch rules, or human review. Its only job is to detect a failing
# main SHA, create a revert branch, and open a PR through the protected path.
#
# Keep this file operationally narrow:
# - do not add engine rules here
# - do not reinterpret CI failure meanings here
# - do not push corrective commits directly to main
# - do not turn polling timeout into a revert decision
name: Protect main (auto-revert on CI failure)

on:
  # DEV NOTE: Trigger only after main receives a push.
  #
  # This keeps the workflow bound to main-state protection. It must not run on
  # pull_request because PR checks already happen before merge and this workflow
  # acts on a concrete main SHA.
  push:
    branches:
      - main

permissions:
  # DEV NOTE: Permissions are intentionally broad enough for branch creation,
  # PR creation, and workflow-run inspection. Do not expand these unless a new
  # step has a specific audited need.
  contents: write
  pull-requests: write
  actions: read

concurrency:
  # DEV NOTE: Scope concurrency by SHA, not branch, so independent main pushes
  # can be evaluated separately. cancel-in-progress stays false so an older
  # failing SHA is not silently dropped while it is being assessed.
  group: protect-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  protect-main:
    name: Auto-revert failing main push
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      # DEV NOTE: This list is the workflow allowlist this guard observes.
      #
      # Names must match GitHub workflow names, not filenames. Adding or removing
      # a required workflow changes the main protection contract and should be
      # reviewed as a release-boundary change.
      REQUIRED_WORKFLOWS_JSON: '["green","ci","runnable-v0","vertical-slice","engine-status"]'

    steps:
      # DEV NOTE: Checkout must target main with full history.
      #
      # git revert needs the failed commit and its parent available locally.
      # persist-credentials remains true because later steps push the revert
      # branch using the workflow token.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # DEV NOTE: Revert commits must be clearly attributable to the GitHub bot.
      # Do not use a human identity here; audit clarity matters more than style.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # DEV NOTE: This step makes the only revert/no-op/timeout decision.
      #
      # It observes the required workflow runs for exactly github.sha. It must not
      # inspect unrelated branch state or infer success from missing data. Missing
      # and pending workflows keep polling; completed non-success workflows trigger
      # a revert decision.
      - name: Wait for required workflows for this main SHA
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # DEV NOTE: Polling window is finite by design.
          #
          # A timeout is reported but does not create a revert PR. Required
          # workflows remain the source of truth; this workflow only reacts once
          # their run state is visible for the target SHA.
          max_attempts=80
          sleep_seconds=15

          # DEV NOTE: jq is used to parse the JSON allowlist deterministically
          # instead of relying on shell word splitting.
          required="$(jq -r '.[]' <<< '${{ env.REQUIRED_WORKFLOWS_JSON }}')"

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Polling required workflows for $TARGET_SHA (attempt $attempt/$max_attempts)"

            runs_json="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100")"

            echo "$runs_json" > runs.json

            missing=0
            pending=0
            failed=0
            failure_names=()

            while IFS= read -r workflow_name; do
              row="$(jq -c --arg name "$workflow_name" '
                [
                  .workflow_runs[]
                  | select(.name == $name)
                ]
                | sort_by(.run_number)
                | last // empty
              ' runs.json)"

              if [ -z "$row" ]; then
                echo "Workflow '$workflow_name' not found yet for this SHA."
                missing=1
                continue
              fi

              status="$(jq -r '.status' <<< "$row")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$row")"
              html_url="$(jq -r '.html_url' <<< "$row")"

              echo "Workflow '$workflow_name': status=$status conclusion=$conclusion url=$html_url"

              if [ "$status" != "completed" ]; then
                pending=1
                continue
              fi

              if [ "$conclusion" != "success" ]; then
                failed=1
                failure_names+=("$workflow_name")
              fi
            done <<< "$required"

            if [ "$missing" -eq 0 ] && [ "$pending" -eq 0 ]; then
              if [ "$failed" -eq 1 ]; then
                {
                  echo "decision=revert"
                  echo "failed_sha=$TARGET_SHA"
                  echo "failure_names=$(printf "%s," "${failure_names[@]}" | sed 's/,$//')"
                } >> "$GITHUB_OUTPUT"
              else
                {
                  echo "decision=noop"
                  echo "failed_sha=$TARGET_SHA"
                  echo "failure_names="
                } >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi

            sleep "$sleep_seconds"
          done

          echo "Timed out waiting for required workflows for $TARGET_SHA"
          {
            echo "decision=timeout"
            echo "failed_sha=$TARGET_SHA"
            echo "failure_names="
          } >> "$GITHUB_OUTPUT"

      # DEV NOTE: Success path is intentionally observational only.
      # It records that no revert PR is needed and does not modify the repository.
      - name: Report no-op success path
        if: steps.wait.outputs.decision == 'noop'
        shell: bash
        run: |
          set -euo pipefail
          echo "All required workflows passed for main SHA ${{ steps.wait.outputs.failed_sha }}."
          echo "No revert PR needed."

      # DEV NOTE: Timeout is not treated as proof of a bad main SHA.
      #
      # This avoids creating revert PRs when GitHub Actions run discovery is late
      # or incomplete. Independent workflow results remain authoritative.
      - name: Fail if workflow polling timed out
        if: steps.wait.outputs.decision == 'timeout'
        shell: bash
        run: |
          set -euo pipefail
          echo "Timed out waiting for required workflows for main SHA ${{ steps.wait.outputs.failed_sha }}."
          echo "Polling timeout is non-authoritative when required workflows report independently."
          echo "Do not auto-revert on polling timeout alone."
          exit 0

      # DEV NOTE: Capture immutable context before any branch work.
      # Branch naming is derived from the failed SHA to make duplicate handling
      # deterministic and easy to audit.
      - name: Capture failing main context
        if: steps.wait.outputs.decision == 'revert'
        id: ctx
        shell: bash
        run: |
          set -euo pipefail
          FAILED_SHA="${{ steps.wait.outputs.failed_sha }}"
          BRANCH_NAME="auto/revert-main-${FAILED_SHA:0:8}"
          echo "failed_sha=$FAILED_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "failure_names=${{ steps.wait.outputs.failure_names }}" >> "$GITHUB_OUTPUT"

      # DEV NOTE: Do not revert stale main state.
      #
      # If main has moved after the failing SHA, a new push may already have
      # corrected or superseded the state. This step prevents opening a PR against
      # an obsolete commit.
      - name: Skip if failed SHA is no longer HEAD of main
        if: steps.wait.outputs.decision == 'revert'
        id: headcheck
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          echo "current_main_sha=$CURRENT_MAIN_SHA" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_MAIN_SHA" != "${{ steps.ctx.outputs.failed_sha }}" ]; then
            echo "skip_revert=true" >> "$GITHUB_OUTPUT"
            echo "Main has moved on; not opening revert PR."
          else
            echo "skip_revert=false" >> "$GITHUB_OUTPUT"
          fi

      # DEV NOTE: Idempotency guard for repeat workflow runs.
      # If the revert branch already exists, later PR lookup handles the existing
      # branch instead of creating another branch for the same failed SHA.
      - name: Skip if revert branch already exists
        if: steps.wait.outputs.decision == 'revert' && steps.headcheck.outputs.skip_revert == 'false'
        id: branchexists
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${{ steps.ctx.outputs.branch_name }}" >/dev/null 2>&1; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # DEV NOTE: Revert is created on a branch, not pushed directly to main.
      #
      # This preserves the protected PR path and keeps the auto action reviewable.
      # Keep --no-edit so the commit message is Git's standard revert message for
      # the exact failed SHA.
      - name: Create revert branch and commit
        if: steps.wait.outputs.decision == 'revert' && steps.headcheck.outputs.skip_revert == 'false' && steps.branchexists.outputs.branch_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git switch --create "${{ steps.ctx.outputs.branch_name }}" origin/main
          git revert --no-edit "${{ steps.ctx.outputs.failed_sha }}"

      # DEV NOTE: Push only the named revert branch.
      # Do not change this to push main; main must remain governed by normal branch
      # protection and review rules.
      - name: Push revert branch
        if: steps.wait.outputs.decision == 'revert' && steps.headcheck.outputs.skip_revert == 'false' && steps.branchexists.outputs.branch_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ steps.ctx.outputs.branch_name }}"

      # DEV NOTE: PR idempotency guard.
      # Multiple workflow attempts for the same branch should converge on one open
      # revert PR instead of creating duplicate review surfaces.
      - name: Check for existing open PR from revert branch
        if: steps.wait.outputs.decision == 'revert' && steps.headcheck.outputs.skip_revert == 'false'
        id: existingpr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ steps.ctx.outputs.branch_name }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # DEV NOTE: Open the revert through GitHub's normal PR system.
      #
      # The PR body records the failed SHA and workflow names only. Do not add
      # claims about root cause here; this workflow observes CI state, it does not
      # diagnose failures.
      - name: Open revert PR
        if: steps.wait.outputs.decision == 'revert' && steps.headcheck.outputs.skip_revert == 'false' && steps.existingpr.outputs.pr_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          Emergency revert PR opened automatically because a push to \`main\` failed required workflows.

          Failure context:
          - Failed SHA: \`${{ steps.ctx.outputs.failed_sha }}\`
          - Failed workflows: \`${{ steps.ctx.outputs.failure_names }}\`

          This PR reverts the failing \`main\` commit through the normal protected PR path instead of pushing directly to \`main\`.
          EOF

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${{ steps.ctx.outputs.branch_name }}" \
            --title "revert: failing main commit ${{ steps.ctx.outputs.failed_sha }}" \
            --body-file "$BODY_FILE"

      # DEV NOTE: Labels are operational triage only.
      # They do not affect the revert decision, engine behaviour, or CI outcome.
      - name: Add labels to revert PR
        if: steps.wait.outputs.decision == 'revert' && steps.headcheck.outputs.skip_revert == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ steps.ctx.outputs.branch_name }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --add-label "auto-revert" \
              --add-label "main-red"
          fi

      # DEV NOTE: Final report is informational.
      # The authoritative artefact is the revert PR itself, not this log line.
      - name: Report revert outcome
        if: steps.wait.outputs.decision == 'revert'
        shell: bash
        run: |
          set -euo pipefail
          echo "Revert decision processed for failing main SHA ${{ steps.ctx.outputs.failed_sha }}."
          echo "Failed workflows: ${{ steps.ctx.outputs.failure_names }}"
