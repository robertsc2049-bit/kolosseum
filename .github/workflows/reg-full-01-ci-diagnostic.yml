# ==========================================================
# KOLOSSEUM WORKFLOW POLICY
# ----------------------------------------------------------
# reg-full-01-ci-diagnostic.yml
# - Temporary REG-FULL-01 diagnostic only.
# - Runs only on the REG-FULL-01 feature branch.
# - Captures canonical `npm run ci` output without mutating repo files.
# - Must be deleted before final merge verification.
# ==========================================================
# DEV NOTE: Diagnostic orchestration only. This workflow does not redefine
# engine, registry, release, CI, or product authority. It runs the canonical
# repository CI command unchanged and uploads a reduced failure transcript.
name: REG-FULL-01 CI diagnostic

on:
  push:
    branches:
      - automation/reg-full-01-registry-schema-closure

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 25.9.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Capture canonical CI failure
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/ci-output.log"
          summary="$RUNNER_TEMP/ci-failure-summary.txt"
          npm run ci > "$log" 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo "=== focused failure lines ==="
            grep -En "::error|run_long_npm_script|test:ci command failed|AssertionError|ERR_|CI_[A-Z0-9_]+|not ok|FAILED|failure|Error:" "$log" | tail -n 160 || true
            echo "=== final output ==="
            tail -n 240 "$log"
          } > "$summary"
          exit 0
      - name: Upload diagnostic summary
        uses: actions/upload-artifact@v4
        with:
          name: reg-full-01-ci-failure-summary
          path: ${{ runner.temp }}/ci-failure-summary.txt
          if-no-files-found: error
