# DEV NOTE: Temporary repair orchestration only. The source edit below is an
# exact replacement derived from the current authoritative exercise schema and
# S-V1-25 content-control law. This workflow does not weaken or redefine CI.
name: REG-FULL-01 CI diagnostic

on:
  push:
    branches:
      - automation/reg-full-01-registry-schema-closure

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 25.9.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Patch stale S-REG-34 nested media expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ci/registry/s_reg_34_exercise_reference_media_schema_extension.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''export const S_REG_34_REFERENCE_MEDIA_REQUIRED_KEYS = Object.freeze(["video_url", "source"]);\nexport const S_REG_34_REFERENCE_MEDIA_OPTIONAL_KEYS = Object.freeze(["thumbnail_url"]);\nexport const S_REG_34_REFERENCE_MEDIA_SOURCES = Object.freeze(["coach_entered", "admin_entered"]);'''
          new = '''// S-REG-34 originally introduced `reference_media` as an optional, content-free\n// field. S-V1-25 later hardened the nested media object with source/licence,\n// commercial-use, review and copy-boundary controls. Keep the historical\n// optional/content-free boundary, but validate the current lawful nested shape.\nexport const S_REG_34_REFERENCE_MEDIA_REQUIRED_KEYS = Object.freeze([\n  "video_url",\n  "thumbnail_url",\n  "source",\n  "source_reference",\n  "license_status",\n  "commercial_use_status",\n  "manual_review_status",\n  "legal_review_status",\n  "copy_boundary_flags"\n]);\nexport const S_REG_34_REFERENCE_MEDIA_OPTIONAL_KEYS = Object.freeze([]);\nexport const S_REG_34_REFERENCE_MEDIA_SOURCES = Object.freeze([\n  "founder_original",\n  "licensed_source",\n  "canonical_project_document"\n]);'''
          if old not in text:
              if new in text:
                  print('S-REG-34 nested media expectation already current.')
                  raise SystemExit(0)
              raise SystemExit('Expected S-REG-34 stale constants not found; refusing broad edit.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Prove S-REG-34 repair
        run: node --test test/s_reg_34_exercise_reference_media_schema_extension.test.mjs
      - name: Commit proven S-REG-34 repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ci/registry/s_reg_34_exercise_reference_media_schema_extension.mjs
          if git diff --cached --quiet; then
            echo "S-REG-34 repair already committed."
            exit 0
          fi
          git commit -m "fix(registry): align S-REG-34 proof with current media contract"
          git push origin HEAD:automation/reg-full-01-registry-schema-closure
