name: reg-full-01-fix-ajv-keyword

on:
  push:
    branches:
      - automation/reg-full-01-registry-schema-closure

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'fix(registry): register compatibility schema annotation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: automation/reg-full-01-registry-schema-closure
      - name: Register closed compatibility annotation with strict Ajv validators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          schema_guard = Path('ci/scripts/schema_guard.mjs')
          s = schema_guard.read_text()
          needle = "ajv.addMetaSchema(draft7Meta);\n"
          insert = """ajv.addMetaSchema(draft7Meta);\n\n// REG-FULL-01 compatibility schemas use one closed annotation to distinguish\n// non-authoritative compatibility bodies/references from canonical schema authority.\najv.addKeyword({\n  keyword: \"x-kolosseum-authority\",\n  schemaType: \"string\",\n  metaSchema: {\n    type: \"string\",\n    enum: [\"compatibility_only\", \"compatibility_reference\"]\n  },\n  valid: true\n});\n"""
          assert s.count(needle) == 1
          s = s.replace(needle, insert)
          schema_guard.write_text(s)

          law_guard = Path('ci/guards/registry_law_guard.mjs')
          s = law_guard.read_text()
          needle = "const ajv = new Ajv({ allErrors: true, strict: true, validateSchema: false });\n"
          insert = """const ajv = new Ajv({ allErrors: true, strict: true, validateSchema: false });\najv.addKeyword({\n  keyword: \"x-kolosseum-authority\",\n  schemaType: \"string\",\n  metaSchema: {\n    type: \"string\",\n    enum: [\"compatibility_only\", \"compatibility_reference\"]\n  },\n  valid: true\n});\n"""
          assert s.count(needle) == 1
          s = s.replace(needle, insert)
          law_guard.write_text(s)
          PY
          git diff --check
      - name: Validate affected guards
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node ci/scripts/schema_guard.mjs
          node ci/guards/registry_law_guard.mjs
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/scripts/schema_guard.mjs ci/guards/registry_law_guard.mjs
          git commit -m 'fix(registry): register compatibility schema annotation'
          git push origin HEAD:automation/reg-full-01-registry-schema-closure
