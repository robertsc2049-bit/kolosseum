# ==========================================================
# REG-FULL-00 TEMPORARY EVIDENCE DIAGNOSTIC
# ----------------------------------------------------------
# One-shot diagnostic used to print the repository-owned deterministic
# evidence envelope/seal recomputation after REG-FULL-00 schema addition.
# Remove immediately after capturing the canonical output.
# ==========================================================
name: reg-full-00-evidence-diagnostic

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  evidence-diagnostic:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "25.9.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Print canonical evidence envelope and seal
        run: |
          node ci/scripts/evidence_seal.mjs --print
          sha256sum ci/schemas/final_registry_surface_manifest.schema.json
