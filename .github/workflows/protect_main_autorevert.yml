# DEV NOTE: This workflow is the last-line protection for `main`.
#
# It does not define engine law, CI token meaning, or release scope. Its only
# responsibility is operational containment: if a push reaches `main` and the
# canonical CI command fails, create a normal Git revert commit and open an
# issue with the failed run details.
#
# Behaviour boundary:
# - Do not soften the failure condition.
# - Do not add retry, fallback, ignore, or best-effort behaviour.
# - Do not make this workflow interpret why CI failed.
# - Keep the actual proof authority inside `npm run ci` and the repository CI
#   scripts it invokes.
name: Protect main (auto-revert on CI failure)

on:
  push:
    branches: [ main ]

# DEV NOTE: Auto-revert concurrency must stay serialized.
#
# Multiple rapid pushes to `main` can each produce failing CI runs. This group
# prevents separate revert jobs from racing against the same branch tip.
# `cancel-in-progress: false` is intentional: a revert already in progress
# should complete rather than being abandoned mid-containment.
#
# Avoid two reverts fighting each other if multiple pushes happen fast
concurrency:
  group: protect-main
  cancel-in-progress: false

# DEV NOTE: Permissions are deliberately narrow but write-capable.
#
# `contents: write` is required to push the revert commit.
# `issues: write` is required to create the audit issue after containment.
# Do not broaden this unless a new, explicit workflow responsibility is added.
permissions:
  contents: write
  issues: write

jobs:
  # DEV NOTE: This job reruns the canonical CI command against the exact `main`
  # commit that triggered the workflow. It must stay boring and direct:
  # checkout, install, run CI. Adding partial checks here would create a second
  # definition of green and risk drift from the repository contract.
  ci:
    name: green:ci on main
    runs-on: ubuntu-latest
    steps:
      # DEV NOTE: Full history is required because the failure path creates a
      # revert commit. Shallow checkout can make revert behaviour unreliable.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # DEV NOTE: Node version is pinned through `.nvmrc` so local, CI, and
      # protected-main execution share the same runtime contract.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # DEV NOTE: `npm ci` is intentional. It installs from the lockfile and
      # fails on dependency drift rather than silently updating dependency state.
      - name: Install
        run: npm ci

      # DEV NOTE: This is the only proof command this workflow trusts.
      # If this command fails, `main` is treated as invalid and the failure path
      # below must run. Do not replace it with a weaker command.
      - name: Run CI
        id: run_ci
        run: npm run ci

  # DEV NOTE: Failure containment path.
  #
  # This job must only run when the CI job fails. It should not attempt repair,
  # diagnosis, selective rollback, or force-push cleanup. A normal revert commit
  # preserves history and makes the containment action auditable.
  revert_on_failure:
    name: Auto-revert failing main push
    needs: [ ci ]
    # DEV NOTE: Keep this condition strict. A skipped, softened, or manually
    # reinterpreted CI result must not trigger custom logic here.
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      # DEV NOTE: Full history is required for `git revert HEAD`.
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # DEV NOTE: Bot identity makes the containment commit clearly attributable
      # and separates the revert action from a human author.
      - name: Configure git
        run: |
          git config user.name "kolosseum-bot"
          git config user.email "kolosseum-bot@users.noreply.github.com"

      # DEV NOTE: Revert exactly the triggering branch tip.
      #
      # Do not use reset, force-push, cherry-pick repair, or edited revert
      # messages here. The objective is auditable restoration, not manual fixing.
      - name: Revert HEAD
        run: |
          echo "CI failed; reverting HEAD on main."
          git revert --no-edit HEAD

      # DEV NOTE: Push the generated revert commit back to `main`.
      # If branch protection blocks this, the workflow should fail visibly;
      # do not hide the failure or add alternate push paths here.
      - name: Push revert
        run: |
          git push origin HEAD:main

      # DEV NOTE: The issue is the human handoff record.
      #
      # It must link the failing commit and workflow run, but it must not explain
      # or reinterpret CI failure semantics. The CI logs remain the authority.
      - name: Open issue with details
        run: |
          title="CI FAILED on main; auto-reverted ${{ github.sha }}"
          body="A push to main failed CI and was auto-reverted.\n\nCommit: ${{ github.sha }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
          gh issue create --title "$title" --body "$body"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
