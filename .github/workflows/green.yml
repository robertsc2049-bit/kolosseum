# ==========================================================
# KOLOSSEUM WORKFLOW POLICY
# ----------------------------------------------------------
# green.yml
# - Runs on:
#     - pull_request (all branches)
#     - push to main only
# - Does NOT run on feature branch pushes by design.
# - Heavy validation gate; feature pushes rely on local hook.
#
# This variant formally separates:
#   1) unit (fast, no DB) -> runs npm run green:ci (parity guard requirement)
#   2) integration (DB-backed, spawns dist server)
#   3) ADMIN-08 repository administrative closure (PR only, live GitHub readback)
#
# DEV NOTE: This workflow is the main repository green gate.
# Keep it behaviour-preserving and boring. Do not add feature-specific
# shortcuts, temporary skips, soft-pass branches, or branch-dependent command
# drift here. A passing green workflow should mean the same thing every time.
# ==========================================================
name: green

# DEV NOTE: Trigger boundary.
# Pull requests always run this gate. Main pushes run it after promotion.
# Feature-branch pushes intentionally do not run this heavier workflow; local
# pre-push hooks and targeted slice checks cover that path.
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

# DEV NOTE: Read-only repository access is enough for ordinary green jobs.
# ADMIN-08 declares its additional read permissions at job scope because it must
# reconcile live checks, issues, pull requests, and ruleset metadata without
# mutating any GitHub state.
permissions:
  contents: read

# DEV NOTE: One green run per ref is enough.
# Cancelling stale in-progress runs prevents old commits from consuming CI
# capacity or producing misleading status after newer commits arrive.
concurrency:
  group: green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # DEV NOTE: Required-status-check matching uses the job name. Keep this
    # namespaced so another workflow cannot accidentally satisfy the green gate.
    name: green-unit
    runs-on: ubuntu-latest

    env:
      # DEV NOTE: Node version is pinned to keep CI parity deterministic.
      # Do not replace with latest, node, lts/*, or a version range.
      NODE_VERSION: "25.9.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # DEV NOTE: Full history is intentional.
          # Several repo guards may need tags, ancestry, or accurate diff context.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        # DEV NOTE: npm ci is required for lockfile-exact installs.
        # Do not change to npm install; that would weaken dependency parity.
        run: npm ci

      - name: REG-FULL-00 Registry Authority
        # DEV NOTE: REG-FULL-00 is architecture-only proof. It validates the
        # final registry surface manifest and proves protected registry bytes
        # remain unchanged from the recorded base commit.
        run: |
          node --test test/reg_full_00_final_registry_surface_authority.test.mjs
          node ci/guards/reg_full_00_final_registry_surface_authority_guard.mjs

      - name: REG-FULL-01 Registry Schema Closure
        # DEV NOTE: REG-FULL-01 consumes the final REG-FULL-00 architecture and
        # proves one canonical closed-world schema/ID vocabulary per required-active registry.
        run: |
          node --test test/reg_full_01_registry_schema_closure.test.mjs
          node ci/guards/reg_full_01_registry_schema_closure_guard.mjs

      - name: LAUNCH-00 Current Release Authority
        # DEV NOTE: LAUNCH-00 is release authority only. It validates the new
        # public-launch preparation boundary without activating excluded product
        # surfaces or changing engine, registry, payment, pricing, auth, or UI behaviour.
        run: |
          node --test test/launch_00_current_release_authority.test.mjs
          node scripts/launch_00_current_release_authority_guard.mjs
          npm run verify

      - name: LAUNCH-01 Public Launch Surface Manifest
        # DEV NOTE: LAUNCH-01 classifies the exact current UI inventory against
        # LAUNCH-00. It is an authority gate only and does not expose excluded UI.
        run: |
          node --test test/launch_01_public_launch_surface_manifest.test.mjs
          node scripts/launch_01_public_launch_surface_guard.mjs

      - name: LAUNCH-02 Commercial Pricing and Entitlement Freeze
        # DEV NOTE: LAUNCH-02 freezes provider-agnostic public-launch pricing,
        # hard-cap entitlement law and commercial/engine isolation. It does not
        # connect Stripe, implement checkout, or change deterministic engine law.
        run: |
          node --test test/launch_02_commercial_pricing_entitlement_freeze.test.mjs
          node scripts/launch_02_commercial_pricing_entitlement_guard.mjs

      - name: Green (CI)
        # DEV NOTE: This is the fast deterministic green gate.
        # Keep the actual check set inside package scripts so local and CI
        # execution remain aligned.
        run: npm run green:ci

  integration:
    # DEV NOTE: Keep the integration check namespaced for unambiguous ruleset
    # enforcement. The job id remains integration for needs/dependency wiring.
    name: green-integration
    runs-on: ubuntu-latest
    needs: [unit]

    env:
      # DEV NOTE: Keep this pinned to the unit job version.
      # Unit and integration must not prove different Node environments.
      NODE_VERSION: "25.9.0"
      # DEV NOTE: Database URL targets the GitHub Actions postgres service below.
      # This is integration-only infrastructure; it must not become engine input.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kolosseum_test

    services:
      postgres:
        # DEV NOTE: PostgreSQL version is pinned for CI reproducibility.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kolosseum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kolosseum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # DEV NOTE: Match unit checkout depth to avoid split-brain CI context.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        # DEV NOTE: Lockfile-exact install. Keep this aligned with the unit job.
        run: npm ci

      - name: Build (fast)
        # DEV NOTE: Build before schema/application tests so integration runs
        # against compiled artefacts, not ad hoc source execution.
        run: npm run build:fast

      - name: Apply schema
        # DEV NOTE: Schema application belongs to the app/test database boundary.
        # It must not mutate engine law, registry payloads, or canonical docs.
        run: node scripts/apply-schema.mjs --db-url "${DATABASE_URL}"

      - name: Integration (DB-backed)
        env:
          # DEV NOTE: These flags explicitly enable covered HTTP E2E gates.
          # They are test-scope switches only. They must not be used to alter
          # production engine behaviour or soften failures.
          KOLOSSEUM_HTTP_E2E_RETURN_GATE: "1"
          KOLOSSEUM_HTTP_E2E_COMPLETE_STEP: "1"
          KOLOSSEUM_HTTP_E2E_UNKNOWN_ENGINE_500: "1"
        # DEV NOTE: DB-backed integration is intentionally downstream of unit.
        # Unit failure should stop here; integration does not compensate for a
        # failed fast gate.
        run: npm run test:ci:integration

  admin-closure:
    # DEV NOTE: ADMIN-08 is a PR-only acceptance readback. It runs only after the
    # two required green jobs pass, then reconciles the exact PR head against the
    # complete live required-check set and current GitHub governance state.
    name: admin-repository-closure
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [unit, integration]

    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read

    env:
      NODE_VERSION: "25.9.0"
      ADMIN_REPOSITORY: ${{ github.repository }}
      ADMIN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ADMIN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository administrative closure
        run: node scripts/run_admin_repository_closure.mjs --write

      - name: Upload administrative closure evidence
        if: always() && hashFiles('ci/evidence/admin_repository_closure.v1.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: admin-repository-closure-${{ github.event.pull_request.head.sha }}
          path: ci/evidence/admin_repository_closure.v1.json
          if-no-files-found: error
          retention-days: 30
