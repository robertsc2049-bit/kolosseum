# ==========================================================
# KOLOSSEUM WORKFLOW POLICY
# ----------------------------------------------------------
# green.yml
# - Runs on:
#     - pull_request (all branches)
#     - push to main only
# - Does NOT run on feature branch pushes by design.
# - Heavy validation gate; feature pushes rely on local hook.
#
# This variant formally separates:
#   1) unit (fast, no DB) -> runs npm run green:ci (parity guard requirement)
#   2) integration (DB-backed, spawns dist server)
#   3) ADMIN-08 repository administrative closure (PR only, live GitHub readback)
# ==========================================================
name: green
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: green-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: green-unit
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "25.9.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: REG-FULL-00 Registry Authority
        run: |
          node --test test/reg_full_00_final_registry_surface_authority.test.mjs
          node ci/guards/reg_full_00_final_registry_surface_authority_guard.mjs
      - name: REG-FULL-01 Registry Schema Closure
        run: |
          node --test test/reg_full_01_registry_schema_closure.test.mjs
          node ci/guards/reg_full_01_registry_schema_closure_guard.mjs
      - name: LAUNCH-00 Current Release Authority
        run: |
          node --test test/launch_00_current_release_authority.test.mjs
          node scripts/launch_00_current_release_authority_guard.mjs
          npm run verify
      - name: LAUNCH-01 Public Launch Surface Manifest
        run: |
          node --test test/launch_01_public_launch_surface_manifest.test.mjs
          node scripts/launch_01_public_launch_surface_guard.mjs
      - name: LAUNCH-02 Commercial Pricing and Entitlement Freeze
        run: |
          node --test test/launch_02_commercial_pricing_entitlement_freeze.test.mjs
          node scripts/launch_02_commercial_pricing_entitlement_guard.mjs
      - name: LAUNCH-03 Public Account Registration and Access Activation
        # DEV NOTE: Reconciles existing persistent athlete/coach auth and 1:1
        # relationship permissions. No org scope, provider billing, or engine coupling.
        run: |
          node --test test/launch_03_public_account_access.test.mjs
          node scripts/launch_03_public_account_access_guard.mjs
      - name: Green (CI)
        run: npm run green:ci
  integration:
    name: green-integration
    runs-on: ubuntu-latest
    needs: [unit]
    env:
      NODE_VERSION: "25.9.0"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kolosseum_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kolosseum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kolosseum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (fast)
        run: npm run build:fast
      - name: Apply schema
        run: node scripts/apply-schema.mjs --db-url "${DATABASE_URL}"
      - name: Integration (DB-backed)
        env:
          KOLOSSEUM_HTTP_E2E_RETURN_GATE: "1"
          KOLOSSEUM_HTTP_E2E_COMPLETE_STEP: "1"
          KOLOSSEUM_HTTP_E2E_UNKNOWN_ENGINE_500: "1"
        run: npm run test:ci:integration
  admin-closure:
    name: admin-repository-closure
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [unit, integration]
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    env:
      NODE_VERSION: "25.9.0"
      ADMIN_REPOSITORY: ${{ github.repository }}
      ADMIN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ADMIN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Repository administrative closure
        run: node scripts/run_admin_repository_closure.mjs --write
      - name: Upload administrative closure evidence
        if: always() && hashFiles('ci/evidence/admin_repository_closure.v1.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: admin-repository-closure-${{ github.event.pull_request.head.sha }}
          path: ci/evidence/admin_repository_closure.v1.json
          if-no-files-found: error
          retention-days: 30
