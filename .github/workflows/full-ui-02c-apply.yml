name: full-ui-02c-apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: full-ui-02c-build-diagnostic
  cancel-in-progress: false

jobs:
  diagnose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout slice branch
        uses: actions/checkout@v5
        with:
          ref: automation/full-ui-02c-identity-proof
          fetch-depth: 1
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Apply FULL-UI-02C patch
        run: node scripts/full_ui_02c_apply.mjs

      - name: Diagnose compiled build
        run: |
          if ! npm run build:fast > /tmp/full-ui-02c-build.log 2>&1; then
            echo "FULL-UI-02C BUILD FAILURE"
            tail -n 120 /tmp/full-ui-02c-build.log
            exit 1
          fi
          echo "FULL-UI-02C BUILD PASSED"
