name: full-ui-02c-apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: full-ui-02c-diagnostic
  cancel-in-progress: false

jobs:
  diagnose-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout slice branch
        uses: actions/checkout@v5
        with:
          ref: automation/full-ui-02c-identity-proof
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply FULL-UI-02C patch
        run: node scripts/full_ui_02c_apply.mjs
