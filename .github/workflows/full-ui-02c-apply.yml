name: full-ui-02c-apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: full-ui-02c-ci-diagnostic
  cancel-in-progress: false

jobs:
  diagnose-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout slice branch
        uses: actions/checkout@v5
        with:
          ref: automation/full-ui-02c-identity-proof
          fetch-depth: 0
          show-progress: false

      - name: Check whether diagnostic already exists
        id: diagnostic
        run: |
          if [ -f .full-ui-02c-ci-error.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.diagnostic.outputs.exists != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.diagnostic.outputs.exists != 'true'
        run: npm ci --silent

      - name: Apply and commit candidate locally
        if: steps.diagnostic.outputs.exists != 'true'
        run: |
          node scripts/full_ui_02c_apply.mjs
          rm -f scripts/full_ui_02c_apply.mjs
          rm -rf scripts/.full_ui_02c_payload
          rm -f .github/workflows/full-ui-02c-apply.yml
          rm -f .full-ui-02c-build-error.txt
          rm -f .full-ui-02c-ci-error.txt
          node scripts/full_ui_gap_report.mjs --write
          node scripts/full_ui_gap_report.mjs --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ui): close identity and account proof gaps"
          test -z "$(git status --porcelain)"

      - name: Capture full CI failure without pushing candidate
        if: steps.diagnostic.outputs.exists != 'true'
        run: |
          set +e
          npm run ci > /tmp/full-ui-02c-ci.log 2>&1
          ci_exit=$?
          set -e

          if [ "$ci_exit" -eq 0 ]; then
            echo "FULL-UI-02C FULL CI PASSED"
            exit 0
          fi

          tail -n 300 /tmp/full-ui-02c-ci.log > /tmp/full-ui-02c-ci-error.txt
          git reset --hard origin/automation/full-ui-02c-identity-proof
          git clean -fd
          cp /tmp/full-ui-02c-ci-error.txt .full-ui-02c-ci-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .full-ui-02c-ci-error.txt
          git commit -m "chore(ui): record full ui 02c ci failure"
          git push origin HEAD:automation/full-ui-02c-identity-proof
          exit "$ci_exit"
